<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal</title>
    <style>
        body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: #f5f6f8; color: #1a1a2e; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
        h1 { font-size: 2rem; margin-bottom: .25rem; }
        p.sub { color: #555; margin-top: 0; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 32px; }
        a.card { display: block; text-decoration: none; color: #fff; border-radius: 12px; padding: 28px 24px; font-weight: 600; font-size: 1.25rem; transition: transform .1s ease; }
        a.card:hover { transform: translateY(-3px); }
        a.card small { display: block; font-weight: 400; font-size: .85rem; opacity: .9; margin-top: 6px; }
        .a { background: #0d6efd; } .b { background: #198754; } .c { background: #dc3545; }
        footer { margin-top: 40px; color: #888; font-size: .85rem; }
        code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Portal</h1>
        <p class="sub">하나의 도메인에서 여러 Blazor Server 앱으로 라우팅합니다. 각 앱은 자신의 경로 URL을 유지합니다.</p>
        <div class="cards">
            <a class="card a" href="/a/">Sample A<small>/a</small></a>
            <a class="card b" href="/b/">Sample B<small>/b</small></a>
            <a class="card c" href="/c/">Sample C<small>/c</small></a>
        </div>
        <footer>
            Reverse proxy: YARP &middot; 백엔드 앱 주소는 사용자에게 노출되지 않습니다.
            예) <code>portal.jaywapp.com/a</code> &rarr; 내부 <code>localhost:5001</code>
        </footer>
    </div>
</body>
</html>
